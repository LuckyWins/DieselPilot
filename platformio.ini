; ═══════════════════════════════════════════════════════════════════════════
;                   DIESEL PILOT — FREE — PlatformIO config
; ═══════════════════════════════════════════════════════════════════════════
; Firmware (USB):  pio run -t upload
; LittleFS:        pio run -t buildfs   /   pio run -t uploadfs   (wgrywa data/)
; Monitor:         pio device monitor
;
; Firmware (OTA, po włączeniu OTA w GUI):
;   pio run -t upload --upload-port <ip-urzadzenia>
;   (jeśli ustawiono hasło OTA, dodaj:  --upload-flags --auth=<haslo>)
; ═══════════════════════════════════════════════════════════════════════════

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Tablica partycji: 2x app (OTA) + ~1.5 MB filesystem
board_build.partitions = default.csv
; System plików = LittleFS (a nie domyślny SPIFFS)
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    olikraus/U8g2 @ ^2.35.30
    knolleary/PubSubClient @ ^2.8
    cotestatnt/AsyncTelegram2 @ ^2.3.4
    bblanchon/ArduinoJson @ ^7.4.3

; ── Wgrywanie firmware przez OTA (odkomentuj i ustaw IP/hasło) ──────────────
; upload_protocol = espota
; upload_port     = 192.168.1.50
; upload_flags    = --auth=twoje_haslo_ota

; ═══════════════════════════════════════════════════════════════════════════
; Native tests for the pure logic: pio test -e native  (or make test)
;
; Only Arduino- and hardware-independent code is built here. The .ino itself
; is excluded, hence the explicit build_src_filter.
; ═══════════════════════════════════════════════════════════════════════════

[env:native]
platform         = native
test_framework   = unity
; PlatformIO does not build src/ for tests by default
test_build_src   = yes
build_src_filter = -<*> +<settings.cpp> +<protocol.cpp> +<scheduler.cpp> +<notify.cpp> +<json.cpp> +<stepper.cpp> +<stats.cpp>
build_flags      = -std=gnu++17 -Wall -Wextra
