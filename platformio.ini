; ═══════════════════════════════════════════════════════════════════════════
;                   DIESEL PILOT — FREE — PlatformIO config
; ═══════════════════════════════════════════════════════════════════════════
; Firmware (USB):  pio run -t upload
; LittleFS:        pio run -t buildfs   /   pio run -t uploadfs   (wgrywa data/)
; Monitor:         pio device monitor
;
; Firmware (OTA, po włączeniu OTA w GUI):
;   pio run -t upload --upload-port <ip-urzadzenia>
;   (jeśli ustawiono hasło OTA, dodaj:  --upload-flags --auth=<haslo>)
; ═══════════════════════════════════════════════════════════════════════════

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Tablica partycji: 2x app (OTA) + ~1.5 MB filesystem
board_build.partitions = default.csv
; System plików = LittleFS (a nie domyślny SPIFFS)
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    olikraus/U8g2 @ ^2.35.30
    knolleary/PubSubClient @ ^2.8

; ── Wgrywanie firmware przez OTA (odkomentuj i ustaw IP/hasło) ──────────────
; upload_protocol = espota
; upload_port     = 192.168.1.50
; upload_flags    = --auth=twoje_haslo_ota

; ═══════════════════════════════════════════════════════════════════════════
; Нативные тесты чистой логики: pio test -e native  (или make test)
;
; Собирается только то, что не зависит от Arduino и железа. Сам .ino сюда
; не попадает — отсюда явный build_src_filter.
; ═══════════════════════════════════════════════════════════════════════════

[env:native]
platform         = native
test_framework   = unity
; По умолчанию PlatformIO не собирает src/ для тестов
test_build_src   = yes
build_src_filter = -<*> +<settings.cpp> +<protocol.cpp>
build_flags      = -std=gnu++17 -Wall -Wextra
